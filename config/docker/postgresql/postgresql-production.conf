# PostgreSQL server tuning for the split-instance production deployment.
# Values match DEPLOYMENT_REQUIREMENTS.md §6 and assume a ~32 GB dedicated
# database node (the "data-01" spec). Scale proportionally for other sizes.
#
# The production stack (docker-compose-production.yml) does NOT run Postgres as
# a compose service — it points at an externally provisioned `fineract_db`
# (managed service or self-hosted container, §3). Apply this there: append to
# the server's postgresql.conf, or `-c` each line, or ALTER SYSTEM SET them.
# The local dev stack (docker-compose-splitstack.yml) applies a smaller,
# laptop-appropriate subset via the db service `command:`.

# ── Connections ───────────────────────────────────────────────────────────────
# Must stay ABOVE PgBouncer's max_db_connections (180, config/docker/pgbouncer/
# pgbouncer.ini) — PgBouncer's cap is the real backend ceiling; this is the
# hard limit above it, with headroom for superuser/replication/maintenance.
max_connections = 200

# ── Memory (32 GB node) ───────────────────────────────────────────────────────
shared_buffers = 8GB              # ~25% of RAM
effective_cache_size = 24GB       # ~75% of RAM (planner hint, not an allocation)
work_mem = 64MB                   # per sort/hash node; watch total = work_mem x concurrent ops
maintenance_work_mem = 512MB      # VACUUM / CREATE INDEX / Liquibase migrations

# ── WAL / replication ─────────────────────────────────────────────────────────
wal_level = replica               # required for WAL archiving / read replicas (§6 backups)
