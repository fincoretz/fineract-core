[databases]
; Route all tenant DBs to PostgreSQL — wildcard matches any DB name
* = host=fineract_db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

; transaction mode is ideal for multi-tenant: connections returned to pool
; after each transaction, not each session — maximises reuse
pool_mode = transaction

; ── Auth ──────────────────────────────────────────────────────────────────
; Client-facing auth method must match how clients (Fineract) authenticate.
; Backend (real Postgres) auth is negotiated per-connection by libpq and
; works with scram-sha-256 automatically — no plaintext needed here.
auth_type = scram-sha-256

; auth_query dynamically looks up the password hash from Postgres itself,
; via the pgbouncer_auth() function created by setup-auth.sql. This avoids
; storing/maintaining hardcoded hashes for every user/tenant.
auth_user = pgbouncer_auth
auth_query = SELECT * FROM pgbouncer_auth($1)

; userlist.txt only needs the pgbouncer_auth role's own credentials, so
; PgBouncer can open the initial connection to run auth_query.
auth_file = /etc/pgbouncer/userlist.txt

; connection limits
max_client_conn = 1000
default_pool_size = 10
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3

; idle connection cleanup
server_idle_timeout = 600
client_idle_timeout = 0

; logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; stats
stats_period = 60

; admin
admin_users = fineract
